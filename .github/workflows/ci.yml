name: PharmaTrace CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-validation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: pharma_trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pharma-trace-backend/package-lock.json

      - name: Install Backend Dependencies
        run: cd pharma-trace-backend && npm ci

      - name: Compile Smart Contracts
        run: cd pharma-trace-backend && npm run compile:contract

      - name: Run Backend Unit & Saga Tests
        run: cd pharma-trace-backend && npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: password123
          DB_DATABASE: pharma_trace
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_jwt_secret_ci_cd_pipeline_2026

      - name: Build Backend Production Bundle
        run: cd pharma-trace-backend && npm run build

  frontend-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pharma-trace-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd pharma-trace-frontend && npm ci

      - name: Build Next.js Production Bundle
        run: cd pharma-trace-frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3500

  docker-verification:
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Docker Compose Configuration
        run: docker compose config

